# Side-by-side dashboard on http://localhost:8080.
# Read-only access to exactly the three Secrets it compares in each app namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: demo-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-read
  namespace: app-vso
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-config", "db-creds", "app-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-read
  namespace: app-vso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-read
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: demo-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-read
  namespace: app-eso
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-config", "db-creds", "app-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-read
  namespace: app-eso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-read
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: demo-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: demo-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: python:3.12-alpine
          command: ["python", "-u", "/code/app.py", "dashboard"]
          env:
            - name: PG_MONITOR_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-monitor, key: password, optional: true } }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/state, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
      volumes:
        - name: code
          configMap: { name: app-code }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: demo-ui
spec:
  type: NodePort
  selector: { app: dashboard }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
