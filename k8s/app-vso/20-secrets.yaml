# VSO side: the three secrets the app consumes.

# 1) Static KV secret — event-driven: Vault pushes a change event, VSO syncs immediately.
#    refreshAfter is only the fallback if the event stream drops.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-config
  namespace: app-vso
spec:
  vaultAuthRef: vault
  # Set the Vault namespace on the resource itself, not just on the VaultAuth: VSO keys its
  # event subscription on this field, so leaving it blank silently breaks instant updates.
  namespace: demo  # vault-namespace (set from VAULT_NS)
  mount: kv
  type: kv-v2
  path: app/config
  refreshAfter: 1h
  syncConfig:
    instantUpdates: true
  destination:
    name: app-config
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: app
---
# 2) Dynamic Postgres credential — VSO owns the lease: renews it, rotates at max_ttl,
#    restarts the app on rotation, and revokes it when this resource is deleted.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: db-creds
  namespace: app-vso
spec:
  vaultAuthRef: vault
  namespace: demo  # vault-namespace (set from VAULT_NS)
  mount: database
  path: creds/app-vso
  renewalPercent: 67
  revoke: true
  destination:
    name: db-creds
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: app
---
# 3) Short-lived TLS certificate — renewed expiryOffset before it expires, app restarted,
#    old cert revoked.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: app-tls
  namespace: app-vso
spec:
  vaultAuthRef: vault
  namespace: demo  # vault-namespace (set from VAULT_NS)
  mount: pki
  role: app
  commonName: app.app-vso.svc
  format: pem
  ttl: 5m
  expiryOffset: 30s  # new cert 30 seconds before the current one expires, whatever its TTL
  revoke: true
  clear: true
  destination:
    name: app-tls
    create: true
    type: kubernetes.io/tls
  rolloutRestartTargets:
    - kind: Deployment
      name: app
