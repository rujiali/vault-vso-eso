# ESO side: the three secrets the app consumes.
# Refresh intervals are set to sensible values for each secret, not handicapped:
#   KV   1m  (ESO's default is 1h)
#   DB   5m  (half the 10m credential TTL)
#   TLS  3m  (renews before the 5m cert expires)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: app-eso
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-kv
    kind: SecretStore
  target:
    name: app-config
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: app/config
        property: message
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: app-eso
spec:
  refreshInterval: 5m
  target:
    name: db-creds
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres-creds
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-tls
  namespace: app-eso
spec:
  refreshInterval: 3m
  target:
    name: app-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: app-cert
