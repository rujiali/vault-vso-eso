# ESO side: how this namespace reaches Vault. Same Vault, same namespace, same auth method,
# same service account name as the VSO side — only the operator differs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: app-eso
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-kv
  namespace: app-eso
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      namespace: demo  # vault-namespace (set from VAULT_NS)
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-eso
          serviceAccountRef:
            name: app
            audiences: ["vault"]
---
# Dynamic Postgres credential. ESO generates a fresh credential on every refresh of the
# ExternalSecret that uses it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres-creds
  namespace: app-eso
spec:
  method: GET
  path: /database/creds/app-eso
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    namespace: demo  # vault-namespace (set from VAULT_NS)
    auth:
      kubernetes:
        mountPath: kubernetes
        role: app-eso
        serviceAccountRef:
          name: app
          audiences: ["vault"]
---
# TLS certificate from the PKI engine, via the same generator type.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: app-cert
  namespace: app-eso
spec:
  method: POST
  path: /pki/issue/app
  parameters:
    common_name: app.app-eso.svc
    ttl: 5m
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    namespace: demo  # vault-namespace (set from VAULT_NS)
    auth:
      kubernetes:
        mountPath: kubernetes
        role: app-eso
        serviceAccountRef:
          name: app
          audiences: ["vault"]
