# Vault Enterprise, single node, integrated storage (Raft).
# Plain HTTP inside the lab cluster only — see README "What this lab is not".
global:
  enabled: true

injector:
  enabled: false          # not part of this comparison; keeps the lab lean

server:
  image:
    repository: hashicorp/vault-enterprise
    # tag is set by scripts/10-vault.sh from VAULT_ENT_TAG
  enterpriseLicense:
    secretName: vault-ent-license
    secretKey: license

  authDelegator:
    enabled: true         # lets Vault call the TokenReview API for Kubernetes auth

  service:
    type: NodePort
    nodePort: 30820

  dataStorage:
    enabled: true
    size: 1Gi

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "raft" {
        path    = "/vault/data"
        node_id = "vault-0"
      }

      service_registration "kubernetes" {}

  ha:
    enabled: false

ui:
  enabled: true
