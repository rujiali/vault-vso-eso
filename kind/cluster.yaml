# Single-node kind cluster. Ports are published to your Mac through the Podman machine:
#   http://localhost:8200  -> Vault (NodePort 30820)
#   http://localhost:8080  -> side-by-side dashboard (NodePort 30080)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30820
        hostPort: 8200
        listenAddress: "127.0.0.1"
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
